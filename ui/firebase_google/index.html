<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  ResumeFit: "Sign in with Google" through Firebase Authentication.

  A Streamlit component without a build step. Streamlit renders it in an iframe and
  sends the Firebase web settings as args; on success it returns
  {id_token, refresh_token, nonce} to Python and signs out of the browser copy
  (the Python side keeps the session).
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap');
  body { margin: 0; padding: 1px; font-family: "Inter", system-ui, sans-serif; }
  button {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; height: 42px; padding: 0 16px; box-sizing: border-box;
    border: 1px solid #e5e7eb; border-radius: 0.6rem;
    background: #fff; color: #111827; font: 500 14px "Inter", system-ui, sans-serif;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  button:hover:enabled { background: #f9fafb; border-color: #d1d5db; }
  button:disabled { opacity: 0.6; cursor: default; }
  #msg { color: #b91c1c; font-size: 13px; }
  #msg:not(:empty) { margin-top: 6px; }
</style>
</head>
<body>
<button id="btn" type="button" disabled>
  <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
    <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6C12.3 13.6 17.6 9.5 24 9.5z"/>
    <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.2 5.6c4.2-3.9 7.1-9.6 7.1-17.1z"/>
    <path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.8-6C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.7l7.8-6z"/>
    <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.2-5.6c-2 1.4-4.7 2.3-8.7 2.3-6.4 0-11.7-4.1-13.6-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/>
  </svg>
  <span id="label">Sign in with Google</span>
</button>
<div id="msg"></div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const btn = document.getElementById("btn");
  const label = document.getElementById("label");
  const msg = document.getElementById("msg");
  let auth = null;

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
  }

  const FRIENDLY = {
    "auth/popup-closed-by-user": "The Google window was closed before signing in.",
    "auth/cancelled-popup-request": "The Google window was closed before signing in.",
    "auth/popup-blocked": "Your browser blocked the Google window. Allow pop-ups for this site and try again.",
    "auth/operation-not-allowed": "Google sign-in is not enabled in the Firebase project.",
    "auth/unauthorized-domain": "This address is not an authorised domain in the Firebase project.",
    "auth/network-request-failed": "Cannot reach Google. Check your internet connection.",
    "auth/account-exists-with-different-credential":
      "This email already has a password account. Sign in with email and password instead.",
  };

  window.addEventListener("message", (event) => {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};
    label.textContent = args.label || "Sign in with Google";
    if (!auth) {
      if (!args.api_key || !args.project_id) {
        msg.textContent = "Firebase is not configured on the server.";
        return;
      }
      const app = initializeApp({
        apiKey: args.api_key, authDomain: args.auth_domain, projectId: args.project_id,
      });
      auth = getAuth(app);
    }
    btn.disabled = false;
  });

  btn.addEventListener("click", async () => {
    if (!auth) return;
    btn.disabled = true;
    msg.textContent = "";
    try {
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      const result = await signInWithPopup(auth, provider);
      const idToken = await result.user.getIdToken();
      send("streamlit:setComponentValue", {
        value: { id_token: idToken, refresh_token: result.user.refreshToken, nonce: Date.now() },
        dataType: "json",
      });
      await signOut(auth);
    } catch (err) {
      msg.textContent = FRIENDLY[err.code] || ("Google sign-in failed (" + (err.code || err) + ").");
    } finally {
      btn.disabled = false;
    }
  });

  // Fit the frame to the button, and grow it only while a message is shown.
  new ResizeObserver(() => {
    send("streamlit:setFrameHeight", { height: document.body.scrollHeight });
  }).observe(document.body);

  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: document.body.scrollHeight });
</script>
</body>
</html>
